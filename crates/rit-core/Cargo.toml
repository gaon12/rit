[package]
name = "rit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rit_core"
path = "src/lib.rs"

[features]
default = []
large-files = ["lfs", "xet"]
lfs = ["dep:serde", "dep:serde_json", "dep:sha2"]
semantic-rust = ["semantic-tree-sitter", "dep:tree-sitter-rust"]
semantic-tree-sitter = ["dep:tree-sitter"]
semantic-typescript = ["semantic-tree-sitter", "dep:tree-sitter-typescript"]
xet = ["dep:serde"]

[dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.147", optional = true }
sha2 = { version = "0.10.9", optional = true }
tree-sitter = { version = "0.26.8", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
toml = "1.1.2"
