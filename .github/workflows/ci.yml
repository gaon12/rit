name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  release-build:
    name: release ${{ matrix.profile }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        profile:
          - rit-min
          - rit-full
        include:
          - profile: rit-min
            features: ""
          - profile: rit-full
            features: "rit-core/large-files,rit-core/semantic-json,rit-core/semantic-rust,rit-core/semantic-typescript,rit-core/semantic-python,rit-core/vfs"

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build -p rit-cli --release --locked --features "${{ matrix.features }}"
          else
            cargo build -p rit-cli --release --locked
          fi
